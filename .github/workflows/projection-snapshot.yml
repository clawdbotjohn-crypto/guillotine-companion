name: Capture projection snapshot

on:
  schedule:
    # Independent, off-hour opportunities for Tuesday 20:02/20:07/20:12 Pacific.
    # Both UTC hours are required for PDT/PST; the runtime guard selects the right one.
    - cron: '2 3 * * 3'
    - cron: '7 3 * * 3'
    - cron: '12 3 * * 3'
    - cron: '2 4 * * 3'
    - cron: '7 4 * * 3'
    - cron: '12 4 * * 3'
  workflow_dispatch:
    inputs:
      season:
        description: NFL season (defaults to repository variable)
        required: false
        type: string
      decision_week:
        description: Decision week whose Tuesday cutoff is being captured
        required: true
        type: string
      canonical_cutoff_at:
        description: Canonical Tuesday 20:00 America/Los_Angeles instant (ISO-8601 with offset)
        required: true
        type: string
      provenance:
        description: exact only inside the capture window; otherwise reconstructed
        required: true
        default: reconstructed
        type: choice
        options:
          - reconstructed
          - exact

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out timing resolver
        uses: actions/checkout@v4

      - name: Resolve and guard capture coordinates
        id: coordinates
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PROJECTION_SEASON: ${{ vars.PROJECTION_SEASON }}
          PROJECTION_FIRST_DECISION_WEEK_LOCAL_DATE: ${{ vars.PROJECTION_FIRST_DECISION_WEEK_LOCAL_DATE }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_DECISION_WEEK: ${{ inputs.decision_week }}
          INPUT_CANONICAL_CUTOFF_AT: ${{ inputs.canonical_cutoff_at }}
          INPUT_PROVENANCE: ${{ inputs.provenance }}
        run: node api/scripts/resolve-projection-snapshot-schedule.js

      - name: Report safely skipped timing
        if: steps.coordinates.outputs.capture != 'true'
        env:
          SKIP_REASON: ${{ steps.coordinates.outputs.reason }}
        run: |
          echo "::notice title=Projection snapshot skipped::$SKIP_REASON; no API or upstream capture was attempted."
          printf '### Projection snapshot skipped\n\n- Reason: `%s`\n- No POST, Sleeper fetch, or database write was attempted.\n' "$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate workflow configuration and scheduler authentication
        id: health
        if: steps.coordinates.outputs.capture == 'true'
        env:
          API_URL: ${{ secrets.PROJECTION_SNAPSHOT_API_URL }}
          SCHEDULER_SECRET: ${{ secrets.PROJECTION_SNAPSHOT_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          if [[ -z "${SCHEDULER_SECRET:-}" ]]; then
            echo "::error title=Missing workflow secret::PROJECTION_SNAPSHOT_SCHEDULER_SECRET is not available to this workflow."
            exit 1
          fi
          if [[ -z "${API_URL:-}" ]]; then
            echo "::error title=Missing workflow endpoint::PROJECTION_SNAPSHOT_API_URL is not configured."
            exit 1
          fi

          health_body="$RUNNER_TEMP/projection-snapshot-health.txt"
          if ! health_status=$(curl --silent --show-error --output "$health_body" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 20 \
            --request HEAD \
            --header "X-Projection-Snapshot-Secret: $SCHEDULER_SECRET" \
            "$API_URL"); then
            echo "::error title=Snapshot API error::Health request could not reach the configured endpoint."
            exit 1
          fi

          case "$health_status" in
            204)
              echo "::notice title=Snapshot scheduler health::Endpoint configuration and scheduler authentication passed."
              ;;
            401|403|404)
              echo "::error title=Endpoint/auth mismatch::Health check returned HTTP $health_status. Verify the endpoint and synchronize the workflow/runtime scheduler secret."
              exit 1
              ;;
            *)
              echo "::error title=Snapshot API error::Side-effect-free health check returned HTTP $health_status. Inspect managed-function configuration/runtime logs before the window."
              exit 1
              ;;
          esac

      - name: Recheck capture coordinates immediately before POST
        id: final_coordinates
        if: steps.coordinates.outputs.capture == 'true' && steps.health.outcome == 'success'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PROJECTION_SEASON: ${{ vars.PROJECTION_SEASON }}
          PROJECTION_FIRST_DECISION_WEEK_LOCAL_DATE: ${{ vars.PROJECTION_FIRST_DECISION_WEEK_LOCAL_DATE }}
          INPUT_SEASON: ${{ inputs.season }}
          INPUT_DECISION_WEEK: ${{ inputs.decision_week }}
          INPUT_CANONICAL_CUTOFF_AT: ${{ inputs.canonical_cutoff_at }}
          INPUT_PROVENANCE: ${{ inputs.provenance }}
        run: node api/scripts/resolve-projection-snapshot-schedule.js

      - name: Report timing window closed after health check
        if: steps.coordinates.outputs.capture == 'true' && steps.health.outcome == 'success' && steps.final_coordinates.outputs.capture != 'true'
        env:
          SKIP_REASON: ${{ steps.final_coordinates.outputs.reason }}
        run: |
          echo "::notice title=Projection snapshot skipped::$SKIP_REASON after health check; no POST or upstream capture was attempted."
          printf '### Projection snapshot skipped after health check\n\n- Reason: `%s`\n- No POST, Sleeper fetch, or database write was attempted.\n' "$SKIP_REASON" >> "$GITHUB_STEP_SUMMARY"

      - name: Capture immutable projection snapshot
        if: steps.final_coordinates.outputs.capture == 'true' && steps.health.outcome == 'success'
        env:
          API_URL: ${{ secrets.PROJECTION_SNAPSHOT_API_URL }}
          SCHEDULER_SECRET: ${{ secrets.PROJECTION_SNAPSHOT_SCHEDULER_SECRET }}
          SEASON: ${{ steps.final_coordinates.outputs.season }}
          DECISION_WEEK: ${{ steps.final_coordinates.outputs.decision_week }}
          CANONICAL_CUTOFF_AT: ${{ steps.final_coordinates.outputs.canonical_cutoff_at }}
          PROVENANCE: ${{ steps.final_coordinates.outputs.provenance }}
        run: |
          set -euo pipefail
          request_body=$(node -e 'process.stdout.write(JSON.stringify({ season: Number(process.env.SEASON), decisionWeek: Number(process.env.DECISION_WEEK), canonicalCutoffAt: process.env.CANONICAL_CUTOFF_AT, provenance: process.env.PROVENANCE }))')
          response_body="$RUNNER_TEMP/projection-snapshot-response.json"
          if ! response_status=$(curl --silent --show-error --output "$response_body" --write-out '%{http_code}' \
            --connect-timeout 5 --max-time 150 \
            --request POST \
            --header "X-Projection-Snapshot-Secret: $SCHEDULER_SECRET" \
            --header 'Content-Type: application/json' \
            --data "$request_body" \
            "$API_URL"); then
            echo "::error title=Snapshot API error::Capture request could not reach the configured endpoint; no blind retry will run."
            exit 1
          fi

          node api/scripts/report-projection-snapshot-response.js "$response_status" "$response_body"
